<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#1a1033;font-family:'Nunito',system-ui,sans-serif}a{color:#fcd34d;text-decoration:none}a:hover{color:#fde68a}</style>
</helmet>
<div data-screen-label="Čtečka" onClick="{{ onScreenTap }}" style="position:relative;width:390px;height:844px;margin:0 auto;overflow:hidden;background:#241447;color:#fdf3d7;user-select:none;cursor:pointer">
  <div style="{{ bgStyle }}"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none;background:linear-gradient(180deg,rgba(16,8,36,0),rgba(16,8,36,.38))"></div>
  <div style="{{ captionStyle }};position:absolute;left:0;right:0;pointer-events:none;display:flex;flex-direction:column;gap:6px;padding:0 26px;text-align:center">
    <p style="margin:0;font-family:'Alegreya',Georgia,serif;font-size:21px;line-height:1.35;font-weight:800;text-wrap:pretty;text-shadow:0 1px 2px rgba(14,7,32,.9),0 2px 10px rgba(14,7,32,.85),0 0 24px rgba(14,7,32,.7)">
      <sc-for list="{{ words }}" as="w" hint-placeholder-count="0"><span style="{{ w.style }}">{{ w.t }}</span></sc-for>
    </p>
  </div>
  <div style="{{ panelStyle }}">
    <div style="position:absolute;left:0;right:0;bottom:0;padding:90px 0 26px;display:flex;justify-content:center;background:linear-gradient(180deg,rgba(16,8,36,0),rgba(16,8,36,.75))">
      <div onClick="{{ stop }}" style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 22px 12px;border-radius:32px;background:rgba(30,16,58,.65);border:1.5px solid rgba(253,224,138,.4);backdrop-filter:blur(12px);cursor:default;width:280px;box-sizing:border-box">
        <div style="display:flex;align-items:center;justify-content:center;gap:18px">
          <button onClick="{{ onPrev }}" aria-label="Předchozí strana" style="{{ discNavStyle }}" style-active="transform:scale(.94)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
          <button onClick="{{ onPlay }}" aria-label="Přehrát / pozastavit" style="{{ playBtnStyle }}" style-active="transform:scale(.94)">{{ playIcon }}</button>
          <button onClick="{{ onNext }}" aria-label="Další strana" style="{{ discNavStyle }}" style-active="transform:scale(.94)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
        </div>
        <div style="display:flex;align-items:center;gap:10px;width:100%">
          <input type="range" min="0" max="10" value="{{ page }}" onChange="{{ onPage }}" aria-label="Strana pohádky" style="flex:1;height:20px;margin:0;accent-color:#f59e0b;cursor:pointer">
          <span style="flex:none;font-size:13px;font-weight:800;color:rgba(253,243,215,.9)">{{ page }} / 10</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;stav&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Zastaveno (s přehrávačem)&quot;,&quot;options&quot;:[&quot;Zastaveno (s přehrávačem)&quot;,&quot;Přehrává se (čistý obraz)&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stav přehrávání&quot;},&quot;pozadi&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Na dece pod stromem&quot;,&quot;options&quot;:[&quot;Na kládě&quot;,&quot;Na dece pod stromem&quot;,&quot;V dutině stromu&quot;,&quot;Na kládě (postavy dole)&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Vzhled&quot;},&quot;svetlost&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Zlatý soumrak&quot;,&quot;options&quot;:[&quot;Zlatý soumrak&quot;,&quot;Hluboká noc&quot;,&quot;Fialový samet&quot;,&quot;Mléčná pohádka&quot;,&quot;Smaragdový les&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Vzhled&quot;},&quot;tempo&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:340,&quot;min&quot;:180,&quot;max&quot;:600,&quot;step&quot;:20,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Čtení&quot;},&quot;tlacitka&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Oranžová lesklá&quot;,&quot;options&quot;:[&quot;Oranžová lesklá&quot;,&quot;Zlatý medailon&quot;,&quot;Noční obloha&quot;,&quot;Akvarel&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Vzhled&quot;}}">
class Component extends DCLogic {
  state = { ui: true, playing: false, sent: 0, wi: 0, page: 5 };
  sents = [
    'Děti šly hlouběji a hlouběji do lesa, až se před nimi objevila tajemná cesta.',
    'Cesta se leskla měsíčním světlem a mezi kameny poblikávaly malé lucerničky.',
    'Nicolásek vzal Valentýnku za ruku a společně udělali první krok.',
    'Kdesi v korunách stromů se ozval tichý zvonivý smích.',
  ];
  isPlaying() { return this.props.stav ? this.props.stav !== 'Zastaveno (s přehrávačem)' : this.state.playing; }
  componentDidMount() {
    const loop = () => {
      this.t = setTimeout(() => {
        if (this.isPlaying()) this.setState(s => {
          const n = this.sents[s.sent].split(' ').length;
          if (s.wi < n) return { wi: s.wi + 1 };
          return { sent: (s.sent + 1) % this.sents.length, wi: 0 };
        });
        loop();
      }, +(this.props.tempo ?? 340));
    };
    loop();
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const dsc = ({
      'Oranžová lesklá': { bg: 'linear-gradient(135deg,#f59e0b,#f97316)', gl: '#fff' },
      'Zlatý medailon': { bg: 'linear-gradient(135deg,#fde68a,#d4a017)', gl: '#5b3a00' },
      'Noční obloha': { bg: 'linear-gradient(135deg,#3b2a6b,#1e1442)', gl: '#fde68a' },
      'Akvarel': { bg: 'linear-gradient(135deg,#f9c58d,#f0906b)', gl: '#fff' },
    })[this.props.tlacitka] ?? { bg: 'linear-gradient(135deg,#f59e0b,#f97316)', gl: '#fff' };
    const play = React.createElement('svg', { width: 22, height: 22, viewBox: '0 0 24 24', fill: dsc.gl, style: { marginLeft: '3px' } },
      React.createElement('path', { d: 'M7 4.5v15a1 1 0 0 0 1.53.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5Z' }));
    const pause = React.createElement('svg', { width: 22, height: 22, viewBox: '0 0 24 24', fill: dsc.gl },
      React.createElement('rect', { x: 6, y: 4, width: 4, height: 16, rx: 1.5 }),
      React.createElement('rect', { x: 14, y: 4, width: 4, height: 16, rx: 1.5 }));
    const ui = this.props.stav ? this.props.stav === 'Zastaveno (s přehrávačem)' : this.state.ui;
    const { sent, wi } = this.state;
    const ws = this.sents[sent].split(' ');
    return {
      hasPrev: sent > 0,
      prevSent: sent > 0 ? this.sents[sent - 1] : '',
      bgStyle: { position: 'absolute', inset: 0, width: '390px', height: '844px', backgroundSize: 'cover', backgroundPosition: 'center',
        backgroundImage: 'url(' + (({ 'Na kládě': 'assets/bg-log.jpg', 'Na dece pod stromem': 'assets/bg-blanket.jpg', 'V dutině stromu': 'assets/bg-tree.jpg', 'Na kládě (postavy dole)': 'assets/bg-log-v6.jpg' })[this.props.pozadi] ?? 'assets/bg-blanket.jpg') + ')', filter: (({'Zlatý soumrak':'brightness(1.08) saturate(1.35) sepia(.18) hue-rotate(-14deg) contrast(1.04)','Hluboká noc':'brightness(.42) saturate(.9) contrast(1.12) hue-rotate(6deg)','Fialový samet':'brightness(.78) saturate(1.6) hue-rotate(28deg) contrast(1.06)','Mléčná pohádka':'brightness(1.25) saturate(.62) contrast(.9)','Smaragdový les':'brightness(.8) saturate(1.45) hue-rotate(-58deg) contrast(1.05)'})[this.props.svetlost] ?? 'brightness(1.08) saturate(1.35) sepia(.18) hue-rotate(-14deg) contrast(1.04)') },
      page: this.state.page,
      onPage: (e) => this.setState({ page: +e.target.value }),
      onPrev: (e) => { e.stopPropagation(); this.setState(s => ({ page: Math.max(0, s.page - 1) })); },
      onNext: (e) => { e.stopPropagation(); this.setState(s => ({ page: Math.min(10, s.page + 1) })); },
      discNavStyle: { display: 'flex', alignItems: 'center', justifyContent: 'center', width: '44px', height: '44px', borderRadius: '50%', padding: 0, background: dsc.bg, border: '2.5px solid rgba(255,255,255,.95)', boxShadow: '0 3px 9px rgba(20,8,40,.4),inset 0 2px 5px rgba(255,255,255,.4)', color: dsc.gl, cursor: 'pointer', transition: 'transform .12s ease' },
      playBtnStyle: { display: 'flex', alignItems: 'center', justifyContent: 'center', width: '62px', height: '62px', borderRadius: '50%', background: dsc.bg, border: '2.5px solid rgba(255,255,255,.92)', boxShadow: '0 4px 24px rgba(20,8,40,.35),inset 0 2px 6px rgba(255,255,255,.4)', cursor: 'pointer', transition: 'transform .12s ease' },
      words: ws.map((t, i) => ({
        t: t + ' ',
        style: !this.isPlaying()
          ? { color: '#fdf3d7' }
          : i < wi
            ? { color: '#fdf3d7' }
            : i === wi
              ? { color: '#fcd34d', textShadow: '0 0 14px rgba(252,211,77,.8)' }
              : { color: 'rgba(253,243,215,.4)' },
      })),
      onScreenTap: () => this.setState(s => ({ ui: !s.ui })),
      stop: (e) => e.stopPropagation(),
      onPlay: (e) => { e.stopPropagation(); this.setState(s => ({ playing: !s.playing, ui: s.playing })); },
      playIcon: (this.props.stav ? this.props.stav !== 'Zastaveno (s přehrávačem)' : this.state.playing) ? pause : play,
      captionStyle: 'transition:bottom .25s ease;bottom:' + (ui ? '130px' : '34px'),
      panelStyle: { position: 'absolute', inset: 0, transition: 'opacity .25s ease',
        opacity: ui ? 1 : 0, pointerEvents: ui ? 'auto' : 'none' },
    };
  }
}
</script>
</body>
</html>
