<!--
  Extracted verbatim from: project/2 Vyber pohady.dc.html (lines 295-379)
  Screen: 5. Vytvorit vlastni pohadku
  Note: worldSheetOpen (nazev/popis sveta, fotky, odkaz, prostudovat) + wdescOpen overlay.
  Source: newest CD/Canva handoff zip, 2026-07-27 export. Not a React component -- raw .dc canvas markup/JS.
-->
  <sc-if value="{{ worldSheetOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:72;display:flex;flex-direction:column">
      <div style="{{ ovBgStyle }}"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,8,36,.72),rgba(16,8,36,.42) 32%,rgba(16,8,36,.55) 70%,rgba(14,7,32,.93))"></div>
      <div style="position:relative;display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:50px 20px 26px;gap:14px">
        <div style="display:flex;align-items:center;gap:12px;flex:none">
          <button onClick="{{ onCloseWorld }}" aria-label="Zpět" style="flex:none;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fdf3d7;font-size:22px;font-weight:800;cursor:pointer">‹</button>
          <div style="font-family:'Alegreya',Georgia,serif;font-size:24px;font-weight:800;color:#fdf3d7;text-shadow:0 2px 10px rgba(20,8,40,.7)">Vytvořit vlastní pohádku</div>
        </div>
        <div style="flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px">
          <section style="display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:26px;background:rgba(30,16,58,.6);border:1.5px solid rgba(253,224,138,.28);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(8,3,20,.4)">
          <label style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:11.5px;font-weight:800;letter-spacing:.08em;color:rgba(253,224,138,.85)">NÁZEV SVĚTA</span>
            <input value="{{ wName }}" onChange="{{ onWName }}" placeholder="Pojmenuj svůj svět…" style="height:48px;border:1.5px solid rgba(253,224,138,.4);border-radius:16px;padding:0 15px;font-size:15px;font-weight:700;color:#fdf3d7;background:rgba(16,8,36,.55);backdrop-filter:blur(6px);outline:none;font-family:'Nunito',sans-serif;box-sizing:border-box">
          </label>
          <label style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:11.5px;font-weight:800;letter-spacing:.08em;color:rgba(253,224,138,.85)">POPIS SVĚTA</span>
            <textarea value="{{ wDesc }}" onChange="{{ onWDesc }}" onClick="{{ onWdescOpen }}" rows="4" placeholder="Jak svět vypadá, kdo v něm žije, co se v něm děje…" style="border:1.5px solid rgba(253,224,138,.4);border-radius:16px;padding:12px 15px;font-size:15px;line-height:1.5;font-weight:700;color:#fdf3d7;background:rgba(16,8,36,.55);backdrop-filter:blur(6px);outline:none;resize:none;font-family:'Nunito',sans-serif;cursor:pointer;box-sizing:border-box"></textarea>
          </label>
          </section>
          <section style="display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:26px;background:rgba(30,16,58,.6);border:1.5px solid rgba(253,224,138,.28);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(8,3,20,.4)">
          <div style="display:flex;flex-direction:column;gap:9px">
            <span style="font-size:11.5px;font-weight:800;letter-spacing:.08em;color:rgba(253,224,138,.85)">{{ wPhotoLabel }}</span>
            <div style="display:flex;gap:9px">
              <button onClick="{{ onWPhotoAdd }}" style="{{ secBtnStyle }}" style-active="transform:scale(.96)"><span style="{{ discStyle }}">{{ ico.foto }}</span><span style="text-shadow:0 1px 2px rgba(120,40,0,.35)">Nahrát fotku</span></button>
              <button onClick="{{ onWPhotoAdd }}" style="{{ secBtnStyle }}" style-active="transform:scale(.96)"><span style="{{ discStyle }}">{{ ico.kamera }}</span><span style="text-shadow:0 1px 2px rgba(120,40,0,.35)">Vyfotit</span></button>
            </div>
            <sc-if value="{{ wHasPhotos }}" hint-placeholder-val="{{ false }}">
              <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px">
                <sc-for list="{{ wPhotos }}" as="ph" hint-placeholder-count="3">
                  <div style="{{ ph.style }}">
                    <button onClick="{{ ph.onDel }}" aria-label="Smazat fotku" style="position:absolute;right:-4px;top:-4px;width:20px;height:20px;border-radius:50%;border:none;background:rgba(14,7,32,.85);color:#fdf3d7;font-size:12px;font-weight:800;line-height:1;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.5)">×</button>
                  </div>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{ wNoPhotos }}" hint-placeholder-val="{{ true }}">
              <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px">
                <sc-for list="{{ wSlots }}" as="sl" hint-placeholder-count="5">
                  <div style="aspect-ratio:1;border-radius:12px;border:1.5px dashed rgba(253,224,138,.28);background:rgba(16,8,36,.35);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:rgba(253,224,138,.4)">{{ sl.n }}</div>
                </sc-for>
              </div>
            </sc-if>
          </div>
          <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(253,224,138,.28),transparent)"></div>
          <div style="display:flex;flex-direction:column;gap:9px">
            <div style="display:flex;gap:8px;justify-content:center">
              <button onClick="{{ onWLinkToggle }}" style="{{ secBtnStyle }}" style-active="transform:scale(.96)"><span style="{{ discStyle }}">{{ icoOdkaz }}</span><span style="text-shadow:0 1px 2px rgba(120,40,0,.35)">Odkaz</span></button>
              <button onClick="{{ onWStudy }}" style="{{ secBtnStyle }}" style-active="transform:scale(.96)"><span style="{{ discStyle }}">{{ icoLupa }}</span><span style="text-shadow:0 1px 2px rgba(120,40,0,.35)">Prostudovat</span></button>
            </div>
            <sc-if value="{{ wLinkOn }}" hint-placeholder-val="{{ false }}">
              <input value="{{ wLink }}" onChange="{{ onWLink }}" placeholder="https://…" style="height:44px;border:1.5px solid rgba(253,224,138,.35);border-radius:14px;padding:0 15px;font-size:14px;font-weight:700;color:#fdf3d7;background:rgba(16,8,36,.55);outline:none;font-family:'Nunito',sans-serif;box-sizing:border-box">
            </sc-if>
          </div>

          <sc-if value="{{ wStudied }}" hint-placeholder-val="{{ false }}">
            <div style="border:1px solid rgba(253,224,138,.3);border-radius:16px;padding:12px 14px;background:rgba(16,8,36,.5);font-size:13px;line-height:1.5;font-weight:700;color:rgba(253,243,215,.85);text-wrap:pretty">{{ wStudyNote }}</div>
          </sc-if>
          </section>
        </div>
        <div style="flex:none;display:flex;align-items:center;gap:10px">
          <button onClick="{{ onSaveWorld }}" style="{{ ctaStyleFlat }}" style-active="transform:scale(.97)"><span style="text-shadow:0 1px 2px rgba(120,40,0,.35)">Uložit svět</span></button>
          <button onClick="{{ onCloseWorld }}" style="flex:none;height:62px;padding:0 20px;border:1.5px solid rgba(253,224,138,.35);border-radius:999px;background:rgba(16,8,36,.5);color:#fdf3d7;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer">Zrušit</button>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ wdescOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:82;display:flex;flex-direction:column">
      <div style="{{ ovBgStyle }}"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,8,36,.6),rgba(16,8,36,.2) 28%,rgba(16,8,36,.3) 68%,rgba(14,7,32,.9))"></div>
      <div style="position:relative;display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:54px 20px 30px;gap:16px">
        <div style="display:flex;align-items:center;gap:12px">
          <button onClick="{{ onWdescClose }}" aria-label="Zpět" style="flex:none;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fdf3d7;font-size:22px;font-weight:800;cursor:pointer">‹</button>
          <div style="font-family:'Alegreya',Georgia,serif;font-size:25px;font-weight:800;color:#fdf3d7;text-shadow:0 2px 10px rgba(20,8,40,.7)">Popis světa</div>
        </div>
        <textarea value="{{ wDesc }}" onChange="{{ onWDesc }}" autoFocus="{{ true }}" placeholder="Jak svět vypadá, kdo v něm žije, jaká tam platí pravidla… ✏️" style="flex:1;min-height:0;border:1.5px solid rgba(253,224,138,.4);border-radius:22px;padding:18px;font-size:17px;line-height:1.55;font-weight:700;color:#fdf3d7;background:rgba(16,8,36,.55);backdrop-filter:blur(8px);outline:none;resize:none;font-family:'Nunito',sans-serif;box-sizing:border-box"></textarea>
        <div style="display:flex;gap:10px">
          <button onClick="{{ onWNamet }}" style="{{ secBtnStyle }}" style-active="transform:scale(.96)"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:url(assets/btn-ico-kostka.png) center/cover;box-shadow:0 1px 3px rgba(120,40,0,.25)"></span><span style="text-shadow:0 1px 2px rgba(120,40,0,.35)">Vymysli svět</span></button>
          <button style="{{ secBtnStyle }}" style-active="transform:scale(.96)"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:url(assets/btn-ico-jiskry.png) center/cover;box-shadow:0 1px 3px rgba(120,40,0,.25)"></span><span style="text-shadow:0 1px 2px rgba(120,40,0,.35)">Rozvinout</span></button>
        </div>
        <button onClick="{{ onWdescClose }}" style="{{ ctaDoneStyle }}" style-active="transform:scale(.97)"><span style="text-shadow:0 1px 2px rgba(120,40,0,.35)">Hotovo</span></button>
      </div>
    </div>
  </sc-if>
