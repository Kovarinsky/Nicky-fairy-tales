<!--
  Extracted verbatim from: project/2 Vyber pohady.dc.html (lines 380-447)
  Screen: 6b. Pohadka sheet detail (nazev/zanr/atmosfera)
  Note: pSheetOpen (nazev pohadky, zanr, atmosfera) + pdescOpen ('O cem to bude' big-text overlay).
  Source: newest CD/Canva handoff zip, 2026-07-27 export. Not a React component -- raw .dc canvas markup/JS.
-->
  <sc-if value="{{ pSheetOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:72;display:flex;flex-direction:column">
      <div style="{{ ovBgStyle }}"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,8,36,.72),rgba(16,8,36,.42) 32%,rgba(16,8,36,.55) 70%,rgba(14,7,32,.93))"></div>
      <div style="position:relative;display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:50px 20px 26px;gap:14px">
        <div style="display:flex;align-items:center;gap:12px;flex:none">
          <button onClick="{{ pClose }}" aria-label="Zpět" style="flex:none;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fdf3d7;font-size:22px;font-weight:800;cursor:pointer">‹</button>
          <span style="flex:none;width:48px;height:48px;border-radius:14px;background:url(assets/svety/vlastni-pohadka.jpg) center/cover;border:2px solid #fcd34d"></span>
          <div style="flex:1;min-width:0">
            <div style="font-family:'Alegreya',Georgia,serif;font-size:24px;font-weight:800;color:#fdf3d7;text-shadow:0 2px 10px rgba(20,8,40,.7)">Vlastní pohádka</div>
            <div style="font-size:13px;font-weight:700;color:rgba(253,243,215,.7)">Nastav si příběh úplně po svém</div>
          </div>
        </div>
        <div style="flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px">
          <section style="display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:26px;background:rgba(30,16,58,.6);border:1.5px solid rgba(253,224,138,.28);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(8,3,20,.4)">
            <label style="display:flex;flex-direction:column;gap:6px">
              <span style="font-size:11.5px;font-weight:800;letter-spacing:.08em;color:rgba(253,224,138,.85)">NÁZEV POHÁDKY</span>
              <input value="{{ pName }}" onChange="{{ onPName }}" placeholder="Např. Kouzelná noc v lese" style="height:48px;border:1.5px solid rgba(253,224,138,.4);border-radius:16px;padding:0 15px;font-size:15px;font-weight:700;color:#fdf3d7;background:rgba(16,8,36,.55);backdrop-filter:blur(6px);outline:none;font-family:'Nunito',sans-serif;box-sizing:border-box">
            </label>
            <label style="display:flex;flex-direction:column;gap:6px">
              <span style="font-size:11.5px;font-weight:800;letter-spacing:.08em;color:rgba(253,224,138,.85)">O ČEM TO BUDE</span>
              <textarea value="{{ pDesc }}" onChange="{{ onPDesc }}" onClick="{{ onPdescOpen }}" rows="4" placeholder="Zápletka, prostředí, kdo v ní vystupuje…" style="border:1.5px solid rgba(253,224,138,.4);border-radius:16px;padding:12px 15px;font-size:15px;line-height:1.5;font-weight:700;color:#fdf3d7;background:rgba(16,8,36,.55);backdrop-filter:blur(6px);outline:none;resize:none;font-family:'Nunito',sans-serif;cursor:pointer;box-sizing:border-box"></textarea>
            </label>
          </section>
          <section style="display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:26px;background:rgba(30,16,58,.6);border:1.5px solid rgba(253,224,138,.28);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(8,3,20,.4)">
            <div style="display:flex;flex-direction:column;gap:8px">
              <span style="font-size:11.5px;font-weight:800;letter-spacing:.08em;color:rgba(253,224,138,.85)">ŽÁNR</span>
              <div style="display:flex;flex-wrap:wrap;gap:8px">
                <sc-for list="{{ pZanry }}" as="z" hint-placeholder-count="5">
                  <button onClick="{{ z.onTap }}" style="{{ z.style }}">{{ z.name }}</button>
                </sc-for>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px">
              <span style="font-size:11.5px;font-weight:800;letter-spacing:.08em;color:rgba(253,224,138,.85)">ATMOSFÉRA</span>
              <div style="display:flex;flex-wrap:wrap;gap:8px">
                <sc-for list="{{ pAtmo }}" as="a" hint-placeholder-count="5">
                  <button onClick="{{ a.onTap }}" style="{{ a.style }}">{{ a.name }}</button>
                </sc-for>
              </div>
            </div>
          </section>
        </div>
        <div style="flex:none;display:flex;align-items:center;gap:10px">
          <button onClick="{{ pSave }}" style="{{ ctaStyleFlat }}" style-active="transform:scale(.97)"><span style="text-shadow:0 1px 2px rgba(120,40,0,.35)">Použít pohádku</span></button>
          <button onClick="{{ pClose }}" style="flex:none;height:62px;padding:0 20px;border:1.5px solid rgba(253,224,138,.35);border-radius:999px;background:rgba(16,8,36,.5);color:#fdf3d7;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer">Zrušit</button>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ pdescOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:80;display:flex;flex-direction:column">
      <div style="{{ ovBgStyle }}"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,8,36,.6),rgba(16,8,36,.2) 28%,rgba(16,8,36,.3) 68%,rgba(14,7,32,.9))"></div>
      <div style="position:relative;display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:54px 20px 30px;gap:16px">
        <div style="display:flex;align-items:center;gap:12px">
          <button onClick="{{ onPdescClose }}" aria-label="Zpět" style="flex:none;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fdf3d7;font-size:22px;font-weight:800;cursor:pointer">‹</button>
          <div style="font-family:'Alegreya',Georgia,serif;font-size:25px;font-weight:800;color:#fdf3d7;text-shadow:0 2px 10px rgba(20,8,40,.7)">O čem to bude</div>
        </div>
        <textarea value="{{ pDesc }}" onChange="{{ onPDesc }}" autoFocus="{{ true }}" placeholder="Zápletka, prostředí, kdo v ní vystupuje, čím to skončí… ✏️" style="flex:1;min-height:0;border:1.5px solid rgba(253,224,138,.4);border-radius:22px;padding:18px;font-size:17px;line-height:1.55;font-weight:700;color:#fdf3d7;background:rgba(16,8,36,.55);backdrop-filter:blur(8px);outline:none;resize:none;font-family:'Nunito',sans-serif;box-sizing:border-box"></textarea>
        <div style="display:flex;gap:10px">
          <button onClick="{{ onNametP }}" style="{{ secBtnStyle }}" style-active="transform:scale(.96)"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:url(assets/btn-ico-kostka.png) center/cover;box-shadow:0 1px 3px rgba(120,40,0,.25)"></span><span style="text-shadow:0 1px 2px rgba(120,40,0,.35)">Vymysli námět</span></button>
          <button style="{{ secBtnStyle }}" style-active="transform:scale(.96)"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:url(assets/btn-ico-jiskry.png) center/cover;box-shadow:0 1px 3px rgba(120,40,0,.25)"></span><span style="text-shadow:0 1px 2px rgba(120,40,0,.35)">Rozvinout</span></button>
        </div>
        <button onClick="{{ onPdescClose }}" style="{{ ctaDoneStyle }}" style-active="transform:scale(.97)"><span style="text-shadow:0 1px 2px rgba(120,40,0,.35)">Hotovo</span></button>
      </div>
    </div>
  </sc-if>
