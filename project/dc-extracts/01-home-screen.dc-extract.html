<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
body{margin:0;background:#1a1033;font-family:'Nunito',system-ui,sans-serif}
a{color:#fcd34d}a:hover{color:#fde68a}
@keyframes ffly{0%,100%{opacity:.1;transform:translate(0,0)}25%{opacity:.9;transform:translate(6px,-9px)}50%{opacity:.4;transform:translate(-4px,-16px)}75%{opacity:.85;transform:translate(8px,-6px)}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes omSpin{to{transform:rotate(360deg)}}
@keyframes ctaBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.028)}}
@keyframes ctaSpark{0%,100%{opacity:0;transform:scale(.2)}50%{opacity:1;transform:scale(1)}}
</style>
</helmet>
<div data-screen-label="Home" style="position:relative;width:390px;height:844px;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#241447 0%,#2e1a55 30%,#4a2a63 55%,#6b3d5e 72%,#8a4f52 84%,#3a2344 100%);color:#f7ecd9;user-select:none">
  <span style="display:none">{{ bgTick }}</span>
  <div style="position:absolute;top:64px;right:52px;width:74px;height:74px;border-radius:50%;background:#f8e7b8;box-shadow:0 0 46px 18px rgba(248,231,184,.35);pointer-events:none"></div>
  <div style="position:absolute;top:56px;right:64px;width:74px;height:74px;border-radius:50%;background:#2b1950;pointer-events:none"></div>
  {{ stars }}
  <div style="position:absolute;inset:0;filter:{{ bgJas }}">
    <image-slot id="home-bg" shape="rect" src="{{ bgSrc }}" placeholder="Ilustrace: děti na kládě s kouzelnou knihou, soumrakový les — přetáhněte obrázek"></image-slot>
  </div>
  {{ fireflies }}
  <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(16,8,36,.55) 0%,rgba(16,8,36,.18) 16%,rgba(16,8,36,0) 30%)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;background:{{ bottomScrim }}"></div>
  <header style="position:absolute;top:0;left:0;right:0;padding:64px 20px 0;pointer-events:none;text-align:center">
    <button onClick="{{ onBgOpen }}" aria-label="Zvolit pozadí" style="position:absolute;top:52px;left:16px;pointer-events:auto;display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 6px;border-radius:999px;border:1px solid rgba(253,224,138,.4);background:rgba(30,16,58,.55);backdrop-filter:blur(10px);box-shadow:0 3px 12px rgba(8,3,20,.4);cursor:pointer;font-family:'Nunito',sans-serif;font-size:11.5px;font-weight:800;letter-spacing:.02em;color:rgba(253,243,215,.95)" style-active="transform:scale(.95)">
      <span style="{{ bgThumbStyle }}"></span>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="opacity:.75"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <span style="position:absolute;top:52px;right:16px;padding:3px 9px;border-radius:999px;background:rgba(20,10,44,.5);border:1px solid rgba(253,224,138,.28);backdrop-filter:blur(8px);font-family:'Nunito',sans-serif;font-size:10px;font-weight:800;letter-spacing:.06em;color:rgba(253,224,138,.75)">v4.99.8</span>
    <h1 style="margin:0;font-family:'Alegreya',Georgia,serif;font-size:42px;font-weight:800;line-height:1.08;padding:0 56px;letter-spacing:.01em;color:#fdf3d7;text-shadow:0 0 22px rgba(253,224,138,.5),0 0 48px rgba(253,224,138,.28),0 3px 8px rgba(20,8,40,.65)">Nickyho<br>pohádky</h1>
  </header>
  <footer style="position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:16px;padding:0 20px 26px">
    <button onClick="{{ onStart }}" style="{{ ctaStyle }}" style-active="transform:scale(.97)">
      <span style="position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:999px">
        <span style="position:absolute;left:9%;top:20%;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,244,214,0));box-shadow:0 0 6px 1px rgba(255,248,224,.9);animation:ctaSpark 2.1s ease-in-out infinite"></span>
        <span style="position:absolute;left:16%;top:78%;width:4px;height:4px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,244,214,0));box-shadow:0 0 5px 1px rgba(255,248,224,.85);animation:ctaSpark 2.7s ease-in-out infinite .5s"></span>
        <span style="position:absolute;left:23%;top:14%;width:3px;height:3px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,244,214,0));box-shadow:0 0 4px 1px rgba(255,248,224,.85);animation:ctaSpark 2.3s ease-in-out infinite 1.1s"></span>
        <span style="position:absolute;left:6%;top:56%;width:4px;height:4px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,244,214,0));box-shadow:0 0 5px 1px rgba(255,248,224,.9);animation:ctaSpark 2.5s ease-in-out infinite 1.6s"></span>
        <span style="position:absolute;left:41%;top:11%;width:3px;height:3px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,244,214,0));box-shadow:0 0 4px 1px rgba(255,248,224,.8);animation:ctaSpark 2.9s ease-in-out infinite .3s"></span>
        <span style="position:absolute;left:53%;top:86%;width:4px;height:4px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,244,214,0));box-shadow:0 0 5px 1px rgba(255,248,224,.85);animation:ctaSpark 2.4s ease-in-out infinite 1.3s"></span>
        <span style="position:absolute;left:64%;top:13%;width:3px;height:3px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,244,214,0));box-shadow:0 0 4px 1px rgba(255,248,224,.8);animation:ctaSpark 2.6s ease-in-out infinite 2s"></span>
        <span style="position:absolute;left:73%;top:84%;width:4px;height:4px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,244,214,0));box-shadow:0 0 5px 1px rgba(255,248,224,.85);animation:ctaSpark 2.2s ease-in-out infinite .8s"></span>
        <span style="position:absolute;left:84%;top:24%;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,244,214,0));box-shadow:0 0 6px 1px rgba(255,248,224,.9);animation:ctaSpark 2.5s ease-in-out infinite 1.5s"></span>
        <span style="position:absolute;left:91%;top:64%;width:4px;height:4px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,244,214,0));box-shadow:0 0 5px 1px rgba(255,248,224,.85);animation:ctaSpark 2.8s ease-in-out infinite .2s"></span>
        <span style="position:absolute;left:95%;top:40%;width:3px;height:3px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,244,214,0));box-shadow:0 0 4px 1px rgba(255,248,224,.8);animation:ctaSpark 2.4s ease-in-out infinite 2.4s"></span>
        <span style="position:absolute;left:33%;top:88%;width:3px;height:3px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,244,214,0));box-shadow:0 0 4px 1px rgba(255,248,224,.8);animation:ctaSpark 3s ease-in-out infinite 1.9s"></span>
      </span>
      <span style="{{ discStyle }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px"><path d="M7 4.5v15a1 1 0 0 0 1.53.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5Z"></path></svg></span>
      <span style="text-shadow:0 1px 2px rgba(120,40,0,.35)">Start nové pohádky</span>
    </button>
    <sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ onLoginOpen }}" style="display:flex;align-items:center;justify-content:center;gap:9px;height:46px;border-radius:999px;border:1.5px solid rgba(253,224,138,.55);background:rgba(24,12,48,.45);backdrop-filter:blur(8px);cursor:pointer;font-family:'Nunito',sans-serif;font-size:14.5px;font-weight:800;color:#fdf3d7;margin-top:-8px" style-active="transform:scale(.97)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"></circle><path d="M4.8 20c.9-3.7 3.8-5.6 7.2-5.6s6.3 1.9 7.2 5.6"></path></svg>
        <span>Přihlásit se</span>
      </button>
    </sc-if>
    <div style="align-self:center;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);margin-top:-6px"></div>
  </footer>
