  Extracted verbatim from: project/2 Vyber pohady.dc.html (lines 1-73)
  Screen: 3. Vyber pohadky - krok 1/2 (Svet)
  Note: PRIPRAVENE POHADKY + VLASTNI POHADKY horizontal-scroll sections, plus header/step label.

-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1a1033;font-family:'Nunito',system-ui,sans-serif}
a{color:#fcd34d;text-decoration:none}a:hover{color:#fde68a}
input{font-family:'Nunito',sans-serif}
input::placeholder,textarea::placeholder{color:rgba(253,243,215,.5)}
@keyframes omDone{0%{transform:scale(1)}22%{transform:scale(.95)}55%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes omPulse{0%,72%,100%{transform:scale(1)}82%{transform:scale(1.14)}90%{transform:scale(.97)}}
@keyframes omGlow{0%{box-shadow:0 5px 16px rgba(70,30,130,.45)}45%{box-shadow:0 0 0 10px rgba(253,224,138,.28),0 6px 22px rgba(253,224,138,.5)}100%{box-shadow:0 5px 16px rgba(70,30,130,.45)}}
</style>
</helmet>
<div data-screen-label="Výběr pohádky" style="position:relative;width:390px;height:844px;margin:0 auto;overflow:hidden;background:#241447;color:#fdf3d7;user-select:none">
  <div style="{{ bgStyle }}"></div>
  <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(16,8,36,.6) 0%,rgba(16,8,36,.25) 14%,rgba(16,8,36,.15) 30%,rgba(16,8,36,.55) 60%,rgba(14,7,32,.82) 100%)"></div>
  <header style="position:relative;padding:58px 20px 6px;text-align:center">
    <a href="{{ backHref }}" onClick="{{ onBack }}" style="position:absolute;left:20px;top:52px;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);font-size:20px;color:#fdf3d7">‹</a>
    <h1 style="margin:0;padding:0 60px;font-family:'Alegreya',Georgia,serif;font-size:30px;font-weight:800;color:#fdf3d7;text-shadow:0 0 22px rgba(253,224,138,.5),0 0 48px rgba(253,224,138,.28),0 3px 8px rgba(20,8,40,.65)">Výběr pohádky</h1>
    <div style="margin-top:7px;font-size:12px;font-weight:800;letter-spacing:.09em;color:rgba(253,224,138,.95);text-shadow:0 2px 8px rgba(20,8,40,.9)">{{ stepLabel }}</div>
  </header>
  <div style="position:absolute;top:132px;bottom:104px;left:0;right:0;overflow:auto;padding:8px 16px 12px;box-sizing:border-box">
  <main style="position:relative;display:flex;flex-direction:column;gap:12px">
    <sc-if value="{{ s1 }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:9px">
      <section style="padding:11px 16px 12px;border-radius:24px;background:rgba(30,16,58,.65);border:1.5px solid rgba(253,224,138,.4);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:6px">
        <div style="font-size:11px;font-weight:800;letter-spacing:.09em;color:rgba(253,224,138,.8)">PŘIPRAVENÉ POHÁDKY</div>
        <div style="display:flex;gap:10px;align-items:stretch;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(253,224,138,.55) rgba(255,255,255,.06);margin:0 -16px;padding:2px 16px 6px">
          <sc-for list="{{ readyRoller }}" as="w" hint-placeholder-count="4">
            <button onClick="{{ w.onTap }}" style="{{ w.style }}">
              <sc-if value="{{ w.plus }}" hint-placeholder-val="{{ false }}">
                <span style="animation:omPulse 2.6s ease-in-out infinite;position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#fbbf24,#f97316);border:1.5px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(8,3,20,.6);display:flex;align-items:center;justify-content:center;color:#fffaf0;font-size:17px;font-weight:900;line-height:1;padding-bottom:2px">+</span>
              </sc-if>
              <span style="font-size:26px;line-height:1">{{ w.emoji }}</span>
              <span style="font-size:11px;font-weight:800;line-height:1.2;text-align:center;text-wrap:balance">{{ w.name }}</span>
            </button>
          </sc-for>
        </div>
      </section>
      <section style="padding:11px 16px 12px;border-radius:24px;background:rgba(30,16,58,.65);border:1.5px solid rgba(253,224,138,.4);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:6px">
        <div style="font-size:11px;font-weight:800;letter-spacing:.09em;color:rgba(253,224,138,.8)">VLASTNÍ POHÁDKY</div>
        <div style="display:flex;gap:10px;align-items:stretch;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(253,224,138,.55) rgba(255,255,255,.06);margin:0 -16px;padding:2px 16px 6px">
          <sc-for list="{{ ownRoller }}" as="w" hint-placeholder-count="4">
            <button onClick="{{ w.onTap }}" style="{{ w.style }}">
              <sc-if value="{{ w.plus }}" hint-placeholder-val="{{ false }}">
                <span style="animation:omPulse 2.6s ease-in-out infinite;position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#fbbf24,#f97316);border:1.5px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(8,3,20,.6);display:flex;align-items:center;justify-content:center;color:#fffaf0;font-size:17px;font-weight:900;line-height:1;padding-bottom:2px">+</span>
              </sc-if>
              <span style="font-size:26px;line-height:1">{{ w.emoji }}</span>
              <span style="font-size:11px;font-weight:800;line-height:1.2;text-align:center;text-wrap:balance">{{ w.name }}</span>
            </button>
          </sc-for>
        </div>
      </section>
      <section style="padding:11px 16px 12px;border-radius:24px;background:rgba(30,16,58,.65);border:1.5px solid rgba(253,224,138,.4);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:7px">
        <button onClick="{{ onLocal }}" style="{{ localStyle }}">
          <span style="{{ discStyle }}">{{ ico.poloha }}</span>
          <span style="font-size:13px;font-weight:800">Pohádka podle mé polohy</span>
          
        </button>
        <div style="font-size:11px;font-weight:700;color:rgba(253,243,215,.6);text-wrap:pretty">{{ localHint }}</div>
      </section>
      <div style="display:flex;justify-content:center;margin-top:-4px"><img src="assets/kniha-svetla.png" alt="" style="width:96px;height:auto;filter:drop-shadow(0 0 22px rgba(253,224,138,.45))"></div>
    </div>
    </sc-if>
