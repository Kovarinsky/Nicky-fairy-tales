<!--

  Screen: 9. Vyber hlasu
  Note: Standalone dedicated Hlas.dc.html page (no sc-if branches -- flat single screen), separate from the inline sVoice picker embedded in file 2.

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1a1033;font-family:'Nunito',system-ui,sans-serif}
a{color:#fcd34d;text-decoration:none}a:hover{color:#fde68a}
@keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
</style>
</helmet>
<div data-screen-label="Výběr hlasu" style="position:relative;width:390px;height:844px;margin:0 auto;overflow:hidden;background:#241447;color:#fdf3d7;user-select:none">
  <div style="{{ bgStyle }}"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,8,40,.5),rgba(20,8,40,.15) 35%,rgba(20,8,40,.55))"></div>
  <header style="position:relative;display:flex;align-items:center;gap:12px;padding:48px 20px 6px">
    <a href="1%20Home.dc.html" style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);font-size:20px;color:#fdf3d7">‹</a>
    <h1 style="margin:0;font-family:'Alegreya',Georgia,serif;font-size:26px;font-weight:800;text-shadow:0 0 16px rgba(253,224,138,.45)">Výběr hlasu</h1>
  </header>
  <main style="position:relative;margin:12px 24px 0;padding:18px 20px 16px;border-radius:28px;background:rgba(30,16,58,.55);border:1.5px solid rgba(253,224,138,.4);backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;gap:10px">
    <div style="display:flex;align-items:center;gap:14px">
      <div style="display:flex;align-items:center;gap:4px">{{ wavesLeft }}</div>
      <div style="{{ heroStyle }}"></div>
      <div style="display:flex;align-items:center;gap:4px">{{ wavesRight }}</div>
    </div>
    <div style="text-align:center">
      <div style="font-family:'Alegreya',Georgia,serif;font-size:22px;font-weight:800;color:#fdf3d7">{{ voiceName }}</div>
      <div style="font-size:12px;font-weight:700;color:rgba(253,243,215,.65);margin-top:2px">Google Gemini TTS</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <button aria-label="Přehrát ukázku" style="display:flex;align-items:center;justify-content:center;width:58px;height:58px;border:none;border-radius:50%;background:linear-gradient(135deg,#fcd34d,#f59e0b);box-shadow:0 4px 24px rgba(245,158,11,.35),inset 0 1px 0 rgba(255,255,255,.4);opacity:.65;cursor:default">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#5a3a00" style="margin-left:3px"><path d="M7 4.5v15a1 1 0 0 0 1.53.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5Z"></path></svg>
      </button>
      <div style="font-size:13px;font-weight:800;letter-spacing:.04em;color:#fcd34d">Přehrát ukázku <span style="color:rgba(253,243,215,.55);font-weight:700">(brzy)</span></div>
    </div>
  </main>
  <div style="position:relative;margin-top:14px;padding:0 20px">
    <div style="font-size:14px;font-weight:800;letter-spacing:.03em;margin-bottom:10px;color:rgba(253,243,215,.85)">Vypravěči</div>
    <div style="display:flex;gap:16px">
      <sc-for list="{{ voices }}" as="v" hint-placeholder-count="3">
        <button onClick="{{ v.onTap }}" aria-label="{{ v.name }}" style="display:flex;flex-direction:column;align-items:center;gap:5px;padding:0;border:none;background:none;cursor:pointer">
          <span style="{{ v.style }}"></span>
          <span style="font-size:12px;font-weight:800;color:rgba(253,243,215,.9)">{{ v.name }}</span>
        </button>
      </sc-for>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin:14px 0 8px">
      <span style="font-size:14px;font-weight:800;letter-spacing:.03em;color:rgba(253,243,215,.85)">Premium hlasy</span>
      <span style="font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 9px;border-radius:999px;background:linear-gradient(90deg,#fcd34d,#f59e0b);color:#5a3a00">✨ PREMIUM</span>
    </div>
    <div style="display:flex;gap:6px;justify-content:space-between">
      <sc-for list="{{ premium }}" as="v" hint-placeholder-count="4">
        <button aria-label="{{ v.name }}" style="display:flex;flex-direction:column;align-items:center;gap:5px;padding:0;border:none;background:none;cursor:pointer;width:80px">
          <span style="position:relative;display:block">
            <span style="{{ v.style }}"></span>
            <span style="position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#fcd34d,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid #241447">🔒</span>
          </span>
          <span style="font-size:10px;font-weight:800;color:rgba(253,243,215,.6);line-height:1.15;text-align:center;text-wrap:balance">{{ v.name }}</span>
        </button>
      </sc-for>
    </div>
    <div style="margin-top:6px;font-size:11px;font-weight:700;color:rgba(253,243,215,.55)">Klon hlasu mámy či táty a další hlasy odemknete v Premium.</div>
  </div>
  <footer style="position:absolute;left:0;right:0;bottom:0;padding:0 20px 34px">
    <button style="{{ ctaStyle }}" style-active="transform:scale(.97)"><span style="{{ discStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>Vybrat tento hlas</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;ilustrace&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Na kládě&quot;,&quot;options&quot;:[&quot;Na kládě&quot;,&quot;Na dece pod stromem&quot;,&quot;V dutině stromu&quot;,&quot;Na kládě (postavy dole)&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Motiv&quot;},&quot;svetlost&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Zlatý soumrak&quot;,&quot;options&quot;:[&quot;Zlatý soumrak&quot;,&quot;Hluboká noc&quot;,&quot;Fialový samet&quot;,&quot;Mléčná pohádka&quot;,&quot;Smaragdový les&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Motiv&quot;},&quot;tlacitka&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Oranžová lesklá&quot;,&quot;options&quot;:[&quot;Oranžová lesklá&quot;,&quot;Zlatý medailon&quot;,&quot;Noční obloha&quot;,&quot;Akvarel&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Motiv&quot;}}">
class Component extends DCLogic {
  state = { idx: 0 };
  voices = [
    { k: 'vypravec', n: 'Muž' }, { k: 'vypravecka', n: 'Žena' }, { k: 'vesely', n: 'Dítě' },
  ];
  premiumVoices = [
    { k: 'filmova', n: 'Klon máma' }, { k: 'filmovy', n: 'Klon táta' },
    { k: 'dobrodruzny', n: 'Hollywoodský herec' }, { k: 'dobrodruzna', n: 'Hollywoodská herečka' },
  ];
  bars(side) {
    return React.createElement('span', { style: { display: 'flex', alignItems: 'center', gap: '4px' } },
      [14, 24, 34, 24, 14].map((h, i) => React.createElement('span', {
        key: side + i,
        style: { width: '4px', height: h + 'px', borderRadius: '2px', background: 'linear-gradient(180deg,#fcd34d,#f59e0b)',
          animation: 'wave ' + (0.9 + i * 0.15) + 's ease-in-out ' + (i * 0.12) + 's infinite', transformOrigin: 'center' },
      })));
  }
  renderVals() {
    const i = this.state.idx, v = this.voices[i];
    const ctaSets = { 'Zlatý medailon': { background: 'linear-gradient(135deg,#fcd34d,#d99a1b)', color: '#5a3a00', boxShadow: '0 5px 16px rgba(120,80,10,.4)' }, 'Noční obloha': { background: 'radial-gradient(circle at 50% 15%,#4a2a63,#241447)', color: '#fcd34d', boxShadow: '0 5px 16px rgba(20,8,40,.5)' }, 'Akvarel': { background: 'linear-gradient(135deg,#f6ead2,#e8c9a0)', color: '#7a4a12', boxShadow: '0 5px 16px rgba(20,8,40,.35)' } };
    const ctaStyle = { width: '100%', height: '60px', border: 'none', borderRadius: '999px', color: '#fff', fontFamily: "'Nunito',sans-serif", fontSize: '19px', fontWeight: 800, cursor: 'pointer', transition: 'transform .12s ease', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '10px', ...(ctaSets[this.props.tlacitka] ?? { background: 'linear-gradient(90deg,#f59e0b 0%,#f97316 100%)', boxShadow: '0 4px 24px rgba(245,158,11,.35)' }) };
    const bgs = { 'Na kládě': 'assets/bg-log.jpg', 'Na dece pod stromem': 'assets/bg-blanket.jpg', 'V dutině stromu': 'assets/bg-tree.jpg', 'Na kládě (postavy dole)': 'assets/bg-log-v6.jpg' };
    const discSets = { 'Zlatý medailon': { bg: 'linear-gradient(160deg,#fde68a,#d99a1b)', gl: '#5a3a00' }, 'Noční obloha': { bg: 'radial-gradient(circle at 50% 28%,#5c3c7a,#2a164d)', gl: '#fde68a' }, 'Akvarel': { bg: 'linear-gradient(160deg,#fff6e6,#e0bd8f)', gl: '#7a4a12' } };
    const dsc = discSets[this.props.tlacitka] ?? { bg: 'linear-gradient(160deg,#fbbf5a,#f97316)', gl: '#fff' };
    const discStyle = { display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', width: '30px', height: '30px', borderRadius: '50%', background: dsc.bg, border: '2px solid rgba(255,255,255,.95)', boxShadow: '0 2px 6px rgba(120,40,0,.28),inset 0 2px 5px rgba(255,255,255,.45)', color: dsc.gl };
    return {
      ctaStyle,
      discStyle,
      bgStyle: { position: 'absolute', inset: '-10px', width: '410px', height: '864px',
        backgroundImage: 'url(' + (bgs[this.props.ilustrace] ?? bgs['Na kládě']) + ')',
        backgroundSize: 'cover', backgroundPosition: 'center', filter: 'blur(1.5px) ' + (({'Zlatý soumrak':'brightness(1.08) saturate(1.35) sepia(.18) hue-rotate(-14deg) contrast(1.04)','Hluboká noc':'brightness(.42) saturate(.9) contrast(1.12) hue-rotate(6deg)','Fialový samet':'brightness(.78) saturate(1.6) hue-rotate(28deg) contrast(1.06)','Mléčná pohádka':'brightness(1.25) saturate(.62) contrast(.9)','Smaragdový les':'brightness(.8) saturate(1.45) hue-rotate(-58deg) contrast(1.05)'})[this.props.svetlost] ?? 'brightness(1.08) saturate(1.35) sepia(.18) hue-rotate(-14deg) contrast(1.04)') },
      voiceName: v.n,
      heroStyle: { flex: 'none', width: '92px', height: '92px', borderRadius: '50%',
        backgroundImage: 'url(assets/hlasy/' + v.k + '.png)', backgroundSize: 'cover', backgroundPosition: 'center',
        border: '3px solid #fcd34d', boxShadow: '0 0 28px rgba(253,224,138,.35)' },
      wavesLeft: this.bars('l'), wavesRight: this.bars('r'),
      voices: this.voices.map((x, j) => ({
        name: x.n,
        onTap: () => this.setState({ idx: j }),
        style: { width: '52px', height: '52px', borderRadius: '50%', cursor: 'pointer', padding: 0,
          backgroundImage: 'url(assets/hlasy/' + x.k + '.png)', backgroundSize: 'cover', backgroundPosition: 'center',
          border: j === i ? '3px solid #fcd34d' : '3px solid rgba(255,255,255,.35)',
          boxShadow: j === i ? '0 0 16px rgba(253,224,138,.4)' : '0 3px 8px rgba(20,8,40,.4)' },
      })),
      premium: this.premiumVoices.map(x => ({
        name: x.n,
        style: { width: '52px', height: '52px', borderRadius: '50%', display: 'block',
          backgroundImage: 'url(assets/hlasy/' + x.k + '.png)', backgroundSize: 'cover', backgroundPosition: 'center',
          border: '3px solid rgba(255,255,255,.25)', filter: 'grayscale(.5) brightness(.75)', boxShadow: '0 3px 8px rgba(20,8,40,.4)' },
      })),
    };
  }
}
</script>
</body>
</html>
